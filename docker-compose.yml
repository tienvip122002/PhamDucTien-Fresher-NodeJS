services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mini_order
      POSTGRES_PASSWORD: mini_order
      POSTGRES_DB: mini_order
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mini_order']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata:
